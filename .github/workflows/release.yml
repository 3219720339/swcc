name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            llvm_asset: llvm-mingw-20260616-ucrt-x86_64.zip
            llvm_dir: llvm-mingw-20260616-ucrt-x86_64
          - os: ubuntu-latest
            llvm_asset: llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64.tar.xz
            llvm_dir: llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64
          - os: macos-latest
            llvm_asset: ""
            llvm_dir: ""

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install musl targets
        if: runner.os == 'Linux'
        run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - name: Download llvm-mingw
        if: runner.os != 'macOS'
        shell: bash
        run: |
          url="https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/${{ matrix.llvm_asset }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            curl -fL -o toolchain.archive "$url"
            unzip -q toolchain.archive -d toolchain
          else
            curl -fL -o toolchain.archive "$url"
            mkdir toolchain
            tar -xf toolchain.archive -C toolchain
          fi
          test -x "toolchain/${{ matrix.llvm_dir }}/bin/ld.lld" -o -f "toolchain/${{ matrix.llvm_dir }}/bin/ld.lld.exe"

      - name: Test
        run: cargo test --workspace

      - name: Build release swc
        run: cargo build --release -p swc

      - name: Package SDK
        shell: bash
        run: |
          cd "${{ github.workspace }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            python tools/make-sdk.py "toolchain/${{ matrix.llvm_dir }}" dist
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            python3 tools/make-sdk-linux.py "toolchain/${{ matrix.llvm_dir }}" dist
          else
            python3 tools/make-sdk-macos.py dist
          fi

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-sdk
          path: |
            dist/*.zip
            dist/*.tar.gz
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          # 对全部下载的 SDK 归档生成 GNU 风格校验和清单（哈希  相对路径），
          # 与 tools/make-checksums.py 的输出格式一致，用户可 sha256sum -c 验证
          cd artifacts
          find . -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          echo "== SHA256SUMS =="
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/SHA256SUMS
          generate_release_notes: true
