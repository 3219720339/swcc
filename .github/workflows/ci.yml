name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  LLVM_MINGW_VERSION: 20260616

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            toolchain_asset: llvm-mingw-20260616-ucrt-x86_64.zip
            toolchain_dir: llvm-mingw-20260616-ucrt-x86_64
          - os: ubuntu-latest
            toolchain_asset: llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64.tar.xz
            toolchain_dir: llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64
          - os: macos-latest
            toolchain_asset: llvm-mingw-20260616-ucrt-macos-universal.tar.xz
            toolchain_dir: llvm-mingw-20260616-ucrt-macos-universal

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Linux musl targets
        if: runner.os == 'Linux'
        run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - name: Download llvm-mingw
        shell: bash
        run: |
          url="https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${{ matrix.toolchain_asset }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            curl -fL -o toolchain.archive "$url"
            unzip -q toolchain.archive -d toolchain
          else
            curl -fL -o toolchain.archive "$url"
            mkdir toolchain
            tar -xf toolchain.archive -C toolchain
          fi
          test -x "toolchain/${{ matrix.toolchain_dir }}/bin/ld.lld" -o -f "toolchain/${{ matrix.toolchain_dir }}/bin/ld.lld.exe"

      - name: Cargo fmt check
        run: cargo fmt --all -- --check

      - name: Cargo test
        run: cargo test --workspace

      - name: Build release swc
        run: cargo build --release -p swc

      - name: Sw format check
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ./target/release/swc.exe fmt --check compiler/swc/tests/fixtures/formatted.sw
          else
            ./target/release/swc fmt --check compiler/swc/tests/fixtures/formatted.sw
          fi

      - name: Smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SW_TOOLCHAIN: ${{ github.workspace }}/toolchain/${{ matrix.toolchain_dir }}
        run: |
          New-Item -ItemType Directory -Force build-check | Out-Null
          ./target/release/swc.exe run examples/fib.sw
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/run-examples.py ./target/release/swc.exe
          ./target/release/swc.exe test examples/probe-test.sw
          ./target/release/swc.exe build examples/fib.sw --emit-object build-check/aarch64-linux.o --target aarch64-unknown-linux-gnu
          python tools/check-object.py build-check/aarch64-linux.o elf-aarch64

      - name: Smoke (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          SW_TOOLCHAIN: ${{ github.workspace }}/toolchain/${{ matrix.toolchain_dir }}
        run: |
          mkdir -p build-check
          ./target/release/swc run examples/fib.sw
          python3 tools/run-examples.py ./target/release/swc
          ./target/release/swc test examples/probe-test.sw
          ./target/release/swc build examples/fib.sw --target aarch64-unknown-linux-musl -o build-check/fib-aarch64
          python3 tools/check-object.py build-check/fib-aarch64 elf-aarch64
          ./target/release/swc build examples/hello.sw --target x86_64-unknown-linux-musl -o build-check/hello-x64
          ./build-check/hello-x64

      - name: Smoke (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p build-check
          ./target/release/swc run examples/fib.sw
          python3 tools/run-examples.py ./target/release/swc
          ./target/release/swc test examples/probe-test.sw
          ./target/release/swc build examples/fib.sw --emit-object build-check/fib-macos.o --target aarch64-apple-darwin
          python3 tools/check-object.py build-check/fib-macos.o macho

      - name: Package Windows SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tools/make-sdk.py "${{ github.workspace }}/toolchain/${{ matrix.toolchain_dir }}" dist
          Get-ChildItem dist/swc-windows-x64-*.zip | Select-Object Name, Length

      - name: SDK artifact smoke (no external toolchain)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # 模拟分发用户：无 SW_TOOLCHAIN / SW_STDLIB，仅解压 zip 使用
          SW_TOOLCHAIN: ''
          SW_STDLIB: ''
        run: |
          $ErrorActionPreference = 'Stop'
          # 模拟分发用户：彻底清掉工具链/标准库环境变量（即使 runner 有全局设置）
          Remove-Item Env:SW_TOOLCHAIN -ErrorAction SilentlyContinue
          Remove-Item Env:SW_STDLIB -ErrorAction SilentlyContinue
          Remove-Item Env:SW_RUNTIME -ErrorAction SilentlyContinue
          $zip = Get-ChildItem dist/swc-windows-x64-*.zip | Select-Object -First 1
          if (-not $zip) { throw 'SDK zip not found' }
          $extract = Join-Path $env:RUNNER_TEMP 'sdk-smoke'
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -Path $zip.FullName -DestinationPath $extract -Force
          # 兼容两种 zip 布局：make-sdk.py 生成 swc-windows-x64/ 前缀，
          # make-sdk.ps1 生成扁平布局 —— 统一按"含 swc.exe 与 lib/ 的目录"定位
          $sdk = Join-Path $extract 'swc-windows-x64'
          if (-not (Test-Path (Join-Path $sdk 'swc.exe'))) { $sdk = $extract }
          if (-not (Test-Path (Join-Path $sdk 'swc.exe'))) { throw 'swc.exe missing in extracted SDK' }
          # 关键链接库必须随包分发（编译器固定链接 -lole32 -lws2_32 -luser32 -lgdi32）
          foreach ($lib in @('libucrt.a','libucrtbase.a','libkernel32.a','libshell32.a','libole32.a','libws2_32.a','libwinmm.a','libuser32.a','libgdi32.a','libclang_rt.builtins-x86_64.a')) {
            if (-not (Test-Path (Join-Path $sdk "lib\$lib"))) { throw "SDK missing lib/$lib" }
          }
          foreach ($obj in @('runtime.obj','runtime_audio.obj','runtime_ui.obj','runtime_asm.obj','startup.obj')) {
            if (-not (Test-Path (Join-Path $sdk "lib\$obj"))) { throw "SDK missing runtime object: $obj" }
          }
          $work = Join-Path $env:RUNNER_TEMP 'sdk-smoke-work'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Copy-Item "${{ github.workspace }}/examples/probe-batch11.sw" $work
          Copy-Item "${{ github.workspace }}/examples/hello.sw" $work
          # 联网能力探针（std/http → ws2_32/ole32）：仅编译链接验证库完整
          Push-Location $work
          & "$sdk/swc.exe" build probe-batch11.sw -o probe-b11.exe
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw 'SDK failed to compile networking probe' }
          # 端到端：编译并运行 hello
          & "$sdk/swc.exe" build hello.sw -o hello.exe
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw 'SDK failed to compile hello' }
          & "$work/hello.exe"
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw 'SDK hello run failed' }
          Pop-Location
          Write-Host 'SDK artifact smoke passed (networking probe linked, hello ran)'

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: swc-windows-x64
          path: dist/swc-windows-x64-*.zip
          retention-days: 14
